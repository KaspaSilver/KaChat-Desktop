# Standalone KaChat Desktop:
#
#   docker compose up -d --build
#
# then open http://localhost:5173. To reach it from another machine on the
# network, use this machine's address rather than localhost.
#
# Accounts and settings live in the browser you open it with, not in the
# container, so removing the container loses nothing and there is no volume to
# keep.

services:
  kachat-desktop:
    build:
      context: .
    image: kachat-desktop:local
    container_name: kachat-desktop
    restart: unless-stopped
    ports:
      # Change the left number to serve it somewhere else; the right one is
      # what Vite listens on inside the container and should stay put.
      - "${KACHAT_DESKTOP_PORT:-5173}:5173"
    environment:
      # Optional: set to 1 only on a PRIVATE install whose Nextcloud sits on the same LAN
      # (192.168.x, 10.x ...). The relay then may reach private addresses. Leave it unset on
      # any public deployment - otherwise anyone could use it to reach this host's network.
      KACHAT_RELAY_ALLOW_PRIVATE: ${KACHAT_RELAY_ALLOW_PRIVATE:-}
      # Optional: the reverse proxy in front of this container (Nginx Proxy Manager, nginx ...).
      # The relay rate-limits per client on the connection's own address and believes
      # X-Forwarded-For only from these addresses (IPs or CIDRs, comma separated; default
      # "loopback"). Behind a proxy in another container every request arrives from that proxy,
      # so list its address (e.g. 172.18.0.0/16 for its Docker network) or all readers share
      # one rate-limit bucket. Never list a range untrusted clients can connect from.
      KACHAT_TRUSTED_PROXIES: ${KACHAT_TRUSTED_PROXIES:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start installs dependencies, so give it room before calling
      # the container unhealthy.
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
